# STANDARD Q-MAP source profile: recommended for routine use. Its reading rules were verified row by row against
# the Project Owner's sample files (docs/sample_file_testing). Check the time-zone and two-digit-year settings
# against your own data before relying on it.
# Naming standard: docs/standards/Q-MAP_Naming_and_Reference_Conventions.md, section C.
profile_id      = "xlsx_hdr_isodt"
profile_version = 1
status          = "standard"
display_name    = "Headered XLSX: time (ISO date-time with UTC offset), open, high, low, close, Volume, Net Volume"
source_label    = "XLSX, headered, ISO date-times with UTC offset"
description     = "Excel workbook (.xlsx) with a header row. Column 'time' holds ISO 8601 date-times with a UTC offset, stored as text; trading dates use the exchange time zone Asia/Kolkata (confirm for your data). Prices from open, high, low, close; volume from 'Volume'; 'Net Volume' is kept separately and never used as volume. You type the exchange, symbol and timeframe when loading."
legacy_ids      = ["example_xlsx_headers_iso_offset", "xlsx_headers_iso_offset"]   # earlier names of this layout (still recognised)

[file]
expected_format = "xlsx"
header = true
[instrument]
exchange_from = "ingest"
symbol_from   = "ingest"
timeframe     = "ingest"
[columns]
date  = { name = "time" }
open  = { name = "open" }
high  = { name = "high" }
low   = { name = "low" }
close = { name = "close" }
[datetime]
kind = "iso"
exchange_timezone = "Asia/Kolkata"   # CONFIRM: used to derive each bar's trading date
[volume]
rule = "use_column"
column = "Volume"
preserved_not_volume = ["Net Volume"]
requirement_set = "price_only"
