# STANDARD Q-MAP source profile: recommended for routine use. Its reading rules were verified row by row against
# the Project Owner's sample files (docs/sample_file_testing). Check the time-zone and two-digit-year settings
# against your own data before relying on it.
# Naming standard: docs/standards/Q-MAP_Naming_and_Reference_Conventions.md, section C.
profile_id      = "csv_hdr_unixs"
profile_version = 1
status          = "standard"
display_name    = "Headered CSV: time (Unix seconds), open, high, low, close, Volume, Net Volume"
source_label    = "CSV, headered, Unix timestamps in seconds"
description     = "Comma-separated file with a header row. Column 'time' holds Unix timestamps in seconds (for example 1793262840); trading dates use the exchange time zone Asia/Kolkata (confirm for your data). Prices from open, high, low, close; volume from 'Volume'; 'Net Volume' is kept separately and never used as volume. You type the exchange, symbol and timeframe when loading."
legacy_ids      = ["csv_headers_unix_seconds"]   # earlier names of this layout (still recognised)

[file]
expected_format = "delimited_text"
header = true
[instrument]
exchange_from = "ingest"
symbol_from   = "ingest"
timeframe     = "ingest"
[columns]
date  = { name = "time" }
open  = { name = "open" }
high  = { name = "high" }
low   = { name = "low" }
close = { name = "close" }
[datetime]
kind = "unix_s"
exchange_timezone = "Asia/Kolkata"
[volume]
rule = "use_column"
column = "Volume"
preserved_not_volume = ["Net Volume"]
requirement_set = "price_only"
