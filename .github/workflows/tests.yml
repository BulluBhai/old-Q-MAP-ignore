name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Q-MAP with test and .xls extras
        run: python -m pip install -e ".[dev,xls]"
      - name: Run the full test suite
        env:
          # Windows runners have a desktop, so every GUI test must run there (see Tests/gui/conftest.py)
          QMAP_REQUIRE_GUI_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        run: python -m pytest -p no:cacheprovider
