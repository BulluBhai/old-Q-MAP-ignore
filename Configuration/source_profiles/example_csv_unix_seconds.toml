# EXAMPLE source profile (layout only, no data). Header row + Unix-SECONDS timestamps.
# Check every setting against YOUR file before using it. Q-MAP never guesses any of these.
profile_id      = "example_csv_unix_seconds"
profile_version = 1
source_label    = "CSV, Unix seconds"
description     = "Headered CSV: time (Unix seconds), open, high, low, close, Volume, Net Volume"

[file]
expected_format = "delimited_text"
header = true
delimiter = ","
encoding = "utf-8"

[instrument]
exchange_from = "filename_pattern"
symbol_from   = "filename_pattern"
filename_pattern = "^(?P<exchange>[A-Za-z]+)_(?P<symbol>[A-Za-z0-9&]+)_"
timeframe = "ingest"            # supply with --timeframe (never inferred from the name or the data)

[columns]
date  = { name = "time" }
open  = { name = "open" }
high  = { name = "high" }
low   = { name = "low" }
close = { name = "close" }

[datetime]
kind = "unix_s"                 # SECONDS. Use unix_ms for 13-digit millisecond values.
exchange_timezone = "Asia/Kolkata"   # CONFIRM: used to derive each bar's trading date

[volume]
rule = "use_column"
column = "Volume"
preserved_not_volume = ["Net Volume"]   # kept as x_net_volume; never added to or used as volume
requirement_set = "price_only"
