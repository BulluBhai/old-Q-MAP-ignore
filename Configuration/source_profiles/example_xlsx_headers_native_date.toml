# EXAMPLE source profile (layout only, no data): XLSX, header row, real Excel date cells (daily).
# Check every setting against YOUR file before using it. Q-MAP never guesses any of these.
# Exchange, symbol and timeframe are typed in the window for each load (never inferred).
profile_id      = "example_xlsx_headers_native_date"
profile_version = 1
source_label    = "XLSX, header row, Excel date cells"
description     = "time (Excel date), open, high, low, close, Volume, Net Volume"
[file]
expected_format = "xlsx"
header = true
[instrument]
exchange_from = "ingest"
symbol_from   = "ingest"
timeframe     = "ingest"
[columns]
date  = { name = "time" }
open  = { name = "open" }
high  = { name = "high" }
low   = { name = "low" }
close = { name = "close" }
[datetime]
kind = "native"
precision = "date"
[volume]
rule = "use_column"
column = "Volume"
preserved_not_volume = ["Net Volume"]
requirement_set = "price_only"
