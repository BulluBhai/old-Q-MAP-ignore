# EXAMPLE source profile (layout only, no data). Header row + ISO timestamps with a UTC offset.
profile_id      = "example_csv_iso_offset"
profile_version = 1
source_label    = "CSV, ISO timestamps with offset"
description     = "Headered CSV: time (ISO 8601 with +HH:MM offset), open, high, low, close, Volume, Net Volume"

[file]
expected_format = "delimited_text"
header = true

[instrument]
exchange_from = "filename_pattern"
symbol_from   = "filename_pattern"
filename_pattern = "^(?P<exchange>[A-Za-z]+)_(?P<symbol>[A-Za-z0-9&]+)_"
timeframe = "ingest"

[columns]
date  = { name = "time" }
open  = { name = "open" }
high  = { name = "high" }
low   = { name = "low" }
close = { name = "close" }

[datetime]
kind = "iso"                    # the offset in each value is used; no zone is assumed
exchange_timezone = "Asia/Kolkata"   # CONFIRM: used to derive each bar's trading date

[volume]
rule = "use_column"
column = "Volume"
preserved_not_volume = ["Net Volume"]
requirement_set = "price_only"
