[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmap"
version = "0.1.0rc1"
description = "Q-MAP (Quantitative Market Analytics Platform) - Stage 2 foundation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "tzdata",
    # MA Affinity (QLOPB engine, Application/qlopb): calculations, Excel/PNG/PDF reports
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "reportlab>=4.0",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0.1"]
dev = ["pytest>=7", "pypdf>=4"]  # pypdf: tests read the text of generated PDF reports

[tool.setuptools.packages.find]
where = ["Application"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["Application", "Tests"]
addopts = "-ra"
markers = [
    "windows_compat: file-handling behaviour that matters on Windows (run on Linux here)",
]
