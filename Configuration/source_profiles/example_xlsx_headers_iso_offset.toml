# EXAMPLE source profile (layout only, no data): XLSX, header row, ISO 8601 text with +05:30 offset.
# Check every setting against YOUR file before using it. Q-MAP never guesses any of these.
# Exchange, symbol and timeframe are typed in the window for each load (never inferred).
profile_id      = "example_xlsx_headers_iso_offset"
profile_version = 1
source_label    = "XLSX, header row, ISO timestamps with offset"
description     = "time (ISO +HH:MM), open, high, low, close, Volume, Net Volume"
[file]
expected_format = "xlsx"
header = true
[instrument]
exchange_from = "ingest"
symbol_from   = "ingest"
timeframe     = "ingest"
[columns]
date  = { name = "time" }
open  = { name = "open" }
high  = { name = "high" }
low   = { name = "low" }
close = { name = "close" }
[datetime]
kind = "iso"
exchange_timezone = "Asia/Kolkata"   # CONFIRM: used to derive each bar's trading date
[volume]
rule = "use_column"
column = "Volume"
preserved_not_volume = ["Net Volume"]
requirement_set = "price_only"
